# Checks the live site the way the extension and the auditors do; a failure is a broken site.
name: WEBCAT verify
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install webcat-cli
        run: |
          git clone -q --depth 1 -b schema-1 https://github.com/freedomofpress/webcat-cli /tmp/webcat-cli
          (cd /tmp/webcat-cli && npm ci && npm run build)
          npm install -g /tmp/webcat-cli
      - run: webcat site check element.demo.webcat.tech
      - run: webcat audit element.demo.webcat.tech
